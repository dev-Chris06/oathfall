name: Construire l'APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-android
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
        with:
          # Tout l'historique et les étiquettes : les notes d'une version
          # listent les commits depuis la précédente.
          fetch-depth: 0

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache de Godot et des modèles d'export
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot-cache
          key: godot-android-${{ env.GODOT_VERSION }}

      # Les modèles d'export pèsent plus d'un gigaoctet : on n'en garde que
      # les deux APK Android, et le cache évite de les retélécharger.
      - name: Télécharger Godot et les modèles d'export Android
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot-cache/templates /tmp/godot-dl
          cd /tmp/godot-dl
          curl -fsSL -o godot.zip "${BASE}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "${BASE}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-cache/godot
          unzip -q -j templates.tpz \
            "templates/android_debug.apk" \
            "templates/android_release.apk" \
            "templates/version.txt" \
            -d ~/godot-cache/templates
          rm -rf /tmp/godot-dl
          ls -la ~/godot-cache ~/godot-cache/templates

      - name: Installer Godot
        run: |
          set -euo pipefail
          chmod +x ~/godot-cache/godot
          TEMPLATES=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$TEMPLATES"
          cp ~/godot-cache/templates/* "$TEMPLATES/"
          ~/godot-cache/godot --version --headless

      - name: Préparer la clé de signature de test
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${DEBUG_KEYSTORE_B64}" ]; then
            echo "::error::Le secret DEBUG_KEYSTORE_B64 est absent."
            exit 1
          fi
          echo "${DEBUG_KEYSTORE_B64}" | base64 -d > "${RUNNER_TEMP}/debug.keystore"

      - name: Configurer Godot pour Android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${RUNNER_TEMP}/debug.keystore"
          export/android/debug_keystore_user = "oathfalldebug"
          export/android/debug_keystore_pass = "${KEYSTORE_PASSWORD}"
          EOF
          sed -i 's/^          //' ~/.config/godot/editor_settings-4.7.tres

      - name: Importer les ressources
        run: |
          set -euo pipefail
          ~/godot-cache/godot --headless --path . --import

      # Un joueur automatique livre un vrai combat sans affichage : il abat des
      # morts, leur donne le Repos, vérifie qu'un corps laissé seul se relève
      # et qu'un ennemi sait frapper. Le build échoue si l'un de ces points casse.
      - name: Test automatique du jeu
        run: |
          set -euo pipefail
          ~/godot-cache/godot --headless --path . --fixed-fps 60 -- --selftest 2>&1 | tee selftest.log
          if grep -E "SCRIPT ERROR|^ERROR" selftest.log; then
            echo "::error::Le test automatique a produit des erreurs."
            exit 1
          fi
          grep -q "SELFTEST OK" selftest.log || {
            echo "::error::Le test automatique du jeu a échoué."
            exit 1
          }

      # Export « release » (plus rapide, sans débogage), signé avec la clé du
      # projet : c'est la même que celle des builds précédents, donc le jeu se
      # met à jour par-dessus sans perdre la sauvegarde. Ne jamais en changer.
      - name: Exporter l'APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: oathfalldebug
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p build
          ~/godot-cache/godot --headless --path . --export-release "Android" build/oathfall.apk
          test -s build/oathfall.apk
          # Les versions déjà installées cherchent encore ce nom (bouton Mise à jour).
          cp build/oathfall.apk build/oathfall-debug.apk
          ls -la build

      - name: Vérifier la signature
        run: |
          set -euo pipefail
          APKSIGNER=$(ls "${ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose build/oathfall.apk | head -5
          "$APKSIGNER" verify --print-certs build/oathfall.apk | grep -i "SHA-256"

      - name: Conserver l'APK dans les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: oathfall-apk
          path: build/oathfall.apk
          retention-days: 14

      # Une seule page de téléchargement, toujours à la même adresse, mise à
      # jour à chaque build : pratique pour installer depuis le téléphone.
      - name: Publier le build de test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          # La version est lue par le bouton « Mise à jour » du jeu : garder la
          # forme « Version x.y.z. » au début des notes.
          VERSION="$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)"
          NOTES="Version ${VERSION}. Build automatique. Commit ${SHORT_SHA}, construit le $(date -u '+%Y-%m-%d à %H:%M UTC')."
          if gh release view dev --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit dev --repo "${GITHUB_REPOSITORY}" --notes "${NOTES}"
          else
            gh release create dev --repo "${GITHUB_REPOSITORY}" --prerelease \
              --title "Dernier build de test" --notes "${NOTES}" --target "${GITHUB_SHA}"
          fi
          gh release upload dev build/oathfall.apk build/oathfall-debug.apk --repo "${GITHUB_REPOSITORY}" --clobber

      # Une page par version (vX.Y.Z), gardée pour toujours : l'auteur
      # retrouve chaque APK sur GitHub. Si la version existe déjà (envoi sans
      # changement de numéro), son APK et ses notes sont remplacés.
      - name: Publier la version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)"
          TAG="v${VERSION}"
          PREVIOUS="$(git tag --list 'v*' --sort=-v:refname | grep -vx "${TAG}" | head -1 || true)"
          if [ -n "${PREVIOUS}" ]; then
            CHANGES="$(git log --format='- %s' "${PREVIOUS}..${GITHUB_SHA}")"
            SINCE="Changements depuis ${PREVIOUS} :"
          else
            CHANGES="$(git log --format='- %s' -n 10 "${GITHUB_SHA}")"
            SINCE="Derniers changements :"
          fi
          NOTES="$(printf 'Oathfall %s, commit %s, construit le %s.\n\n%s\n\n%s\n' \
            "${VERSION}" "${GITHUB_SHA::7}" "$(date -u '+%Y-%m-%d à %H:%M UTC')" "${SINCE}" "${CHANGES}")"
          cp build/oathfall.apk "build/oathfall-${VERSION}.apk"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --notes "${NOTES}"
          else
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --title "Oathfall ${VERSION}" --notes "${NOTES}" --target "${GITHUB_SHA}"
          fi
          gh release upload "${TAG}" "build/oathfall-${VERSION}.apk" --repo "${GITHUB_REPOSITORY}" --clobber
